<!DOCTYPE html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JunQi Desktop</title>
    <link rel="icon" href="./assets/icon.png" />
  </head>
  <body class="text-aegis-text font-sans antialiased">
    <div id="app-root">
      <!-- React 挂载前的轻量启动态，不能抢占主题或制造持续视觉噪音。 -->
      <div class="junqi-bootstrap" role="status" aria-live="polite" aria-label="JunQi Desktop">
        <div class="junqi-bootstrap__indicator" aria-hidden="true"></div>
        <span>JunQi Desktop</span>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        html { color-scheme: dark; }
        body { margin: 0; background: #0c1015; }
        .junqi-bootstrap {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          flex-direction: column;
          gap: 12px;
          color: rgb(225 231 238 / 0.56);
          font-family: system-ui, sans-serif;
          font-size: 13px;
        }
        .junqi-bootstrap__indicator {
          width: 24px;
          height: 24px;
          box-sizing: border-box;
          border: 2px solid rgb(225 231 238 / 0.16);
          border-top-color: rgb(56 189 248 / 0.82);
          border-radius: 50%;
          animation: spin 720ms linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          .junqi-bootstrap__indicator {
            animation: none;
            border-top-color: rgb(56 189 248 / 0.82);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
